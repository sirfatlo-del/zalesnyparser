<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Парсер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --card2:#eef1f5; --line:#e4e8ee;
    --txt:#1a1f27; --dim:#6b7480; --accent:#d98a0c;
    --green:#159a55; --red:#e13b3b; --amber:#c07d08; --blue:#2b7fd4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{max-width:660px; margin:0 auto; padding:12px 0 34px}
  .top{display:flex; align-items:baseline; justify-content:space-between; padding:2px 14px 8px}
  .top h1{font-size:17px; margin:0; font-weight:800}
  .top .upd{font-size:11.5px; color:var(--dim)}

  .tabs{display:flex; gap:8px; padding:4px 14px 12px}
  .tab{flex:1; text-align:center; padding:9px 0; border-radius:12px; font-weight:800; font-size:14px;
    background:var(--card2); color:var(--dim); cursor:pointer; user-select:none; border:1.5px solid transparent}
  .tab.on{background:var(--txt); color:#fff}

  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 14px 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; padding:7px 15px; border-radius:999px; font-weight:800; font-size:14px;
    border:1.6px solid transparent; background:var(--card2); cursor:pointer; white-space:nowrap; user-select:none}
  .chip:active{transform:scale(.95)}
  .chip.short{color:var(--red); border-color:rgba(225,59,59,.35)}
  .chip.long{color:var(--green); border-color:rgba(21,154,85,.35)}
  .chip.active.short{background:var(--red); color:#fff; border-color:var(--red)}
  .chip.active.long{background:var(--green); color:#fff; border-color:var(--green)}
  .chip small{opacity:.75; font-weight:700; margin-left:5px}

  .carousel{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .carousel::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%; scroll-snap-align:center; padding:0 14px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:15px 15px 14px; box-shadow:0 1px 6px rgba(20,30,50,.07)}
  .head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .coin{font-size:21px; font-weight:800; letter-spacing:.3px}
  .badge{margin-left:auto; font-size:12.5px; font-weight:800; padding:5px 12px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; color:#fff}
  .b-short{background:var(--red)} .b-long{background:var(--green)} .b-none{background:var(--dim)}
  .hdr{font-size:14px; color:var(--txt); font-weight:600; margin:0 0 8px; padding-bottom:10px; border-bottom:1px solid var(--line)}
  .sec-t{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); margin:13px 0 5px; font-weight:800}
  .p{font-size:14px; margin:4px 0; color:#2b333d}
  .li{font-size:14px; margin:5px 0 5px 4px; padding-left:14px; position:relative; color:#2b333d}
  .li:before{content:"•"; position:absolute; left:0; color:var(--accent); font-weight:800}
  .plan{background:var(--card2); border-radius:10px; padding:10px 12px; margin-top:6px}
  .plan .li{margin:4px 0}

  /* крайм-строки */
  .crow{background:var(--card); border:1px solid var(--line); border-radius:14px; margin:0 14px 9px;
    padding:11px 13px; box-shadow:0 1px 5px rgba(20,30,50,.06)}
  .cr-top{display:flex; align-items:center; gap:9px; margin-bottom:6px}
  .cr-coin{font-size:17px; font-weight:800}
  .cr-lean{margin-left:auto; font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px; color:#fff}
  .cr-nums{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; color:#3a434e}
  .cr-nums b{color:var(--txt)}
  .cr-nums .up{color:var(--green)} .cr-nums .dn{color:var(--red)}

  .empty{text-align:center; color:var(--dim); padding:54px 24px; line-height:1.6}
  .foot{text-align:center; color:var(--dim); font-size:11.5px; margin-top:16px; padding:0 20px}
  .err{background:rgba(225,59,59,.08); border:1px solid rgba(225,59,59,.28); color:#b32020; border-radius:12px; padding:12px; font-size:13px; margin:0 14px}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="top"><h1>🤑 Парсер</h1><span class="upd" id="upd"></span></div>
  <div class="tabs">
    <div class="tab on" id="tab-sig">Сигналы</div>
    <div class="tab" id="tab-crime">Крайм</div>
  </div>

  <div id="view-sig">
    <div class="chips" id="chips"></div>
    <div class="carousel" id="carousel"><div class="empty">Загружаю…</div></div>
  </div>
  <div id="view-crime" class="hidden">
    <div id="crime-analysis"></div>
    <div id="crime-table"></div>
  </div>

  <div class="foot" id="foot"></div>

<script>
try{ const tg=window.Telegram?.WebApp; if(tg){ tg.ready(); tg.expand();
  if(tg.setBackgroundColor) tg.setBackgroundColor('#f4f6f9');
  if(tg.setHeaderColor) tg.setHeaderColor('#f4f6f9'); } }catch(e){}

const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isShort=v=>(v||'').toUpperCase().includes('ШОРТ');
const isLong=v=>(v||'').toUpperCase().includes('ЛОНГ');
const money=n=>{ n=+n||0; if(Math.abs(n)>=1e6) return '$'+(n/1e6).toFixed(1)+'M'; if(Math.abs(n)>=1e3) return '$'+Math.round(n/1e3)+'k'; return '$'+Math.round(n); };

/* ===== вкладка СИГНАЛЫ ===== */
function renderBody(text){
  const lines=(text||'').replace(/\r/g,'').split('\n');
  let html='', inPlan=false, planBuf='';
  const flushPlan=()=>{ if(planBuf){ html+=`<div class="plan">${planBuf}</div>`; planBuf=''; } inPlan=false; };
  for(let raw of lines){ const l=raw.trim(); if(!l) continue;
    if(/^ВЕРДИКТ/i.test(l)) continue;
    if(l.startsWith('🟠')) continue;
    const isTitle=/:$/.test(l) && !/^[•·\-]/.test(l) && l.length<60;
    if(isTitle){ flushPlan(); const t=l.replace(/:$/,''); inPlan=/план/i.test(t); html+=`<div class="sec-t">${esc(t)}</div>`; continue; }
    if(/^[•·\-]/.test(l)){ const txt=l.replace(/^[•·\-]\s*/,''); if(inPlan) planBuf+=`<div class="li">${esc(txt)}</div>`; else html+=`<div class="li">${esc(txt)}</div>`; continue; }
    flushPlan(); html+=`<div class="p">${esc(l)}</div>`;
  }
  flushPlan(); return html;
}
function headerLine(text){ for(const l of (text||'').split('\n')) if(l.trim().startsWith('🟠')) return l.trim().replace(/^🟠\s*/,''); return ''; }
function cardHTML(s){
  const cls=isShort(s.verdict)?'b-short':(isLong(s.verdict)?'b-long':'b-none');
  const hdr=headerLine(s.text);
  return `<div class="card"><div class="head"><span class="coin">${esc(s.coin)}</span>
    <span class="badge ${cls}">${esc(s.verdict||'—')}${s.strength?` ${s.strength}/5`:''}</span></div>
    ${hdr?`<div class="hdr">${esc(hdr)}</div>`:''}<div class="body">${renderBody(s.text)}</div></div>`;
}
let slideW=0, active=0, SIG=[];
const carousel=document.getElementById('carousel'), chipsBox=document.getElementById('chips');
function setActive(i){ if(i<0||i>=SIG.length) return; active=i;
  [...chipsBox.children].forEach((c,idx)=>c.classList.toggle('active', idx===i));
  const chip=chipsBox.children[i]; if(chip) chip.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); }
function renderCrimeAnalysis(list){
  const box=document.getElementById('crime-analysis');
  if(!list.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="sec-t" style="margin:2px 14px 8px">Разборы крайм-монет</div>'
    + list.map(s=>`<div style="padding:0 14px 10px">${cardHTML(s)}</div>`).join('');
}
function loadSignals(){
  fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
    const all=d.signals||[];
    SIG=all.filter(s=>!s.crime);                 // не-крайм → вкладка Сигналы
    renderCrimeAnalysis(all.filter(s=>s.crime));  // крайм-разборы → вкладка Крайм
    if(!SIG.length){ carousel.innerHTML='<div class="empty">Пока коллов нет.<br>Скринер кладёт их сюда раз в 4 часа. Крайм-монеты идут в свою вкладку. Если рынок вялый или всё ПУСТО — пусто, это норма.</div>'; chipsBox.innerHTML=''; return; }
    chipsBox.innerHTML=SIG.map((s,i)=>`<div class="chip ${isShort(s.verdict)?'short':'long'}" data-i="${i}">${esc(s.coin)}<small>${isShort(s.verdict)?'шорт':'лонг'}</small></div>`).join('');
    carousel.innerHTML=SIG.map(s=>`<div class="slide">${cardHTML(s)}</div>`).join('');
    slideW=carousel.clientWidth;
    [...chipsBox.children].forEach(chip=>chip.addEventListener('click',()=>{ const i=+chip.dataset.i; carousel.scrollTo({left:i*slideW, behavior:'smooth'}); setActive(i); }));
    let tmr; carousel.addEventListener('scroll',()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ const i=Math.round(carousel.scrollLeft/slideW); if(i!==active) setActive(i); },60); });
    setActive(0);
  }).catch(e=>{ carousel.innerHTML='<div class="err">Не удалось загрузить сигналы.</div>'; });
}

/* ===== вкладка КРАЙМ ===== */
function crimeRow(c){
  const lean = isShort(c.lean)?'b-short':(isLong(c.lean)?'b-long':'b-none');
  const fp = (c.funding_pct!==undefined && c.funding_pct!==null) ? c.funding_pct : c.fapr;
  const fcls = fp>0?'up':(fp<0?'dn':'');
  const fnext = (c.next_funding_h!==undefined && c.next_funding_h!==null) ? ` · списание через ${c.next_funding_h}ч` : '';
  const chg = c.chg24>=0?`<span class="up">+${c.chg24}%</span>`:`<span class="dn">${c.chg24}%</span>`;
  const jump = (c.oi_jump_pct!==null && c.oi_jump_pct!==undefined && c.oi_jump_pct!==0)
    ? ` <b class="${c.oi_jump_pct>0?'up':'dn'}">скачок за 15м ${c.oi_jump_pct>0?'+':''}${c.oi_jump_pct}%</b>` : '';
  const v=c.vynos||{};
  const vy = v.count ? `<span>выносов <b>${v.count}</b>${v.last_ago_h!=null?` · ${v.last_ago_h}ч назад`:''}${v.ripe?' <b class="up">созрел 6-36ч</b>':''}</span>` : '';
  const b=c.buys||{};
  const bz = b.count ? `<span>закупы <b>${b.count}</b>${b.max_x?` · до x${b.max_x}`:''}${b.last_ago_h!=null?` · ${b.last_ago_h}ч назад`:''}${b.count>=3?' <b class="up">набор под лонг</b>':''}</span>` : '';
  const ripe = v.ripe ? ' style="border-color:var(--accent)"' : '';
  return `<div class="crow"${ripe}>
    <div class="cr-top"><span class="cr-coin">${esc(c.coin)}</span>
      ${c.venue?`<span style="font-size:11px;color:var(--dim);font-weight:700">${esc(c.venue)}</span>`:''}
      <span class="cr-lean ${lean}">${esc(c.lean)}</span></div>
    <div class="cr-nums">
      <span>фандинг <b class="${fcls}">${fp>0?'+':''}${fp}%</b>${fnext}</span>
      <span>сутки ${chg}</span>
      <span>OI <b>${money(c.oi_usd)}</b>${jump}</span>
      <span>объём <b>${money(c.vol_usd)}</b></span>
      ${vy}
      ${bz}
    </div></div>`;
}
function loadCrime(){
  const v=document.getElementById('view-crime'), t=document.getElementById('crime-table');
  fetch('crime.json?t='+Date.now()).then(r=>r.json()).then(d=>{
    const rows=d.coins||[];
    t.innerHTML='<div class="sec-t" style="margin:14px 14px 8px">Пульс фермы · Aster · фандинг и OI</div>'
      + (rows.length ? rows.map(crimeRow).join('') : '<div class="empty">Крайм-монеты пока тихо.</div>');
    v.dataset.upd=d.updated||'';
    if(document.getElementById('tab-crime').classList.contains('on')) document.getElementById('upd').textContent='обновлено '+(d.updated||'');
  }).catch(e=>{ t.innerHTML='<div class="err">Не удалось загрузить крайм-данные.</div>'; });
}

/* ===== переключение вкладок ===== */
const tS=document.getElementById('tab-sig'), tC=document.getElementById('tab-crime');
const vS=document.getElementById('view-sig'), vC=document.getElementById('view-crime');
let sigUpd='';
tS.onclick=()=>{ tS.classList.add('on'); tC.classList.remove('on'); vS.classList.remove('hidden'); vC.classList.add('hidden');
  document.getElementById('upd').textContent = sigUpd?('обновлено '+sigUpd):'';
  document.getElementById('foot').textContent='Коллы парсера (топ по углам). Обновляются раз в 4 часа. Не финсовет.'; };
tC.onclick=()=>{ tC.classList.add('on'); tS.classList.remove('on'); vC.classList.remove('hidden'); vS.classList.add('hidden');
  document.getElementById('upd').textContent='обновлено '+(vC.dataset.upd||'');
  document.getElementById('foot').textContent='Крайм-ферма на Aster. Фандинг минус = уклон ЛОНГ (сквиз), плюс = ШОРТ. Обновление раз в 15 мин. Не финсовет.'; };

fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{ sigUpd=d.updated||''; document.getElementById('upd').textContent = sigUpd?('обновлено '+sigUpd):''; }).catch(()=>{});
document.getElementById('foot').textContent='Коллы парсера (топ по углам). Обновляются раз в 4 часа. Не финсовет.';
loadSignals();
loadCrime();
window.addEventListener('resize',()=>{ const old=active; slideW=carousel.clientWidth; carousel.scrollLeft=old*slideW; });
</script>
</body>
</html>
